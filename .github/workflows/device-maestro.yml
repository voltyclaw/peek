# Maestro on a KVM emulator. Runs when app, Gradle, or .maestro files change
# on master (push or PR), and on workflow_dispatch. No schedule.
# A push or PR whose commit already has a successful run of this workflow is skipped.
#
# Logcat (Release Engineer, 2026-10-10): failure only, app PID plus our crashes,
# scrub-logcat.sh, gitleaks --no-git, fixed path device-logs/logcat-app.txt through
# stage-artifacts.sh and artifact-guard.sh, retention 7 days. Fixture data only.
# Every artifact is public. No signing, secrets, or release changes.
name: Device (Maestro on KVM)

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".maestro/**"
      - ".github/workflows/device-maestro.yml"
      - ".github/scripts/run-maestro.sh"
      - ".github/scripts/scrub-logcat.sh"
  pull_request:
    branches: [master]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".maestro/**"
      - ".github/workflows/device-maestro.yml"
      - ".github/scripts/run-maestro.sh"
      - ".github/scripts/scrub-logcat.sh"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: device-maestro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  YOUTUBE_API_KEY: ""
  MAESTRO_VERSION: "2.11.0"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gate:
    if: github.repository == 'voltyclaw/peek'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
          else
            sha="${{ github.sha }}"
          fi
          last=$(gh run list -R "${{ github.repository }}" -w device-maestro.yml -s success -L 20 --json headSha -q '.[].headSha' || true)
          if printf '%s\n' "$last" | grep -qx "$sha"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::commit $sha already has a successful device run; skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  maestro:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # English only. Hebrew strings stay in the app; this job does not boot a Hebrew AVD.
          - name: en
            api-level: 34
            locale: en-US
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable KVM (CI runner only)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build debug APK (fixture deep links are debug-only)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Install Maestro (pinned)
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-google_apis-x86_64-pixel_6-${{ matrix.locale }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          # No -change-locale: the google_apis image is already en-US, and that flag
          # restarts the framework while this action sends KEYCODE_MENU.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: adb shell settings put global hide_error_dialogs 1

      - name: Run Maestro
        id: run
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/run-maestro.sh

      - name: Stage Maestro reports (allowlist)
        id: stage
        if: always()
        run: |
          bash .github/scripts/stage-artifacts.sh "$RUNNER_TEMP/upload/maestro-${{ matrix.name }}" \
            "build/maestro/junit.xml" \
            "build/maestro/junit-06b.xml" \
            "build/maestro/artifacts/**/*.png"

      - name: Guard reports
        id: guard
        if: always() && steps.stage.outcome == 'success'
        run: bash .github/scripts/artifact-guard.sh "$RUNNER_TEMP/upload/maestro-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        if: always() && steps.guard.outcome == 'success'
        with:
          name: maestro-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ runner.temp }}/upload/maestro-${{ matrix.name }}
          retention-days: 7

      - name: Scrub app logcat
        id: scrub
        if: failure() && steps.run.outcome == 'failure'
        run: bash .github/scripts/scrub-logcat.sh build/maestro/logcat-app.raw device-logs/logcat-app.txt

      - name: Install gitleaks (pinned)
        if: failure() && steps.scrub.outcome == 'success'
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks

      - name: gitleaks over scrubbed logcat (fail = no upload)
        id: leaks
        if: failure() && steps.scrub.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/leakscan" && cp device-logs/logcat-app.txt "$RUNNER_TEMP/leakscan/"
          "$RUNNER_TEMP/gitleaks" detect --no-git --source "$RUNNER_TEMP/leakscan" --redact --exit-code 1 --no-banner

      - name: "Stage logcat (allowlist: fixed path only)"
        id: stage-log
        if: failure() && steps.leaks.outcome == 'success'
        run: bash .github/scripts/stage-artifacts.sh "$RUNNER_TEMP/upload/device-logs-${{ matrix.name }}" "device-logs/logcat-app.txt"

      - name: Guard logcat
        id: guard-log
        if: failure() && steps.stage-log.outcome == 'success'
        run: bash .github/scripts/artifact-guard.sh "$RUNNER_TEMP/upload/device-logs-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        if: failure() && steps.guard-log.outcome == 'success'
        with:
          name: device-logs-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ runner.temp }}/upload/device-logs-${{ matrix.name }}
          retention-days: 7

  report-failure:
    needs: [gate, maestro]
    if: failure() && needs.gate.outputs.run == 'true' && needs.maestro.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open or comment on the nightly-device issue, assigned to the repo owner
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PM_BOARD_URL: "<PM_BOARD_URL_PLACEHOLDER>"
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create nightly-device -R "${{ github.repository }}" --color B60205 \
            --description "Maestro on the KVM emulator failed" 2>/dev/null || true
          open=$(gh issue list -R "${{ github.repository }}" --label nightly-device --state open -L 1 --json number -q '.[0].number')
          body="Maestro device run @ ${GITHUB_SHA::7} failed: $url
          For triage by Android Developer. PM board: $PM_BOARD_URL (add manually; this job has no board token)."
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "${{ github.repository }}" --body "$body"
          else
            if ! gh issue create -R "${{ github.repository }}" --title "Device Maestro failing" \
              --label nightly-device --assignee "$OWNER" --body "$body"; then
              gh issue create -R "${{ github.repository }}" --title "Device Maestro failing" \
                --label nightly-device --body "$body"
            fi
          fi
