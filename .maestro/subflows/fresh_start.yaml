appId: app.pane.android
---
# API 27+ window background is the light theme until Compose draws. Wait until
# Home is actually up before the next deep link, or the viewer wait sits on that
# blank window.
- launchApp:
    appId: app.pane.android
    clearState: true
- extendedWaitUntil:
    visible:
      id: history_door
    timeout: 45000
