appId: app.pane.android
---
# API 27+ window background stays the light theme until Compose draws.
# An ANR dialog on the launcher hides Home, so dismiss that before waiting.
- launchApp:
    appId: app.pane.android
    clearState: true
- runFlow: dismiss_anr.yaml
- launchApp:
    appId: app.pane.android
    clearState: false
    stopApp: false
- extendedWaitUntil:
    visible:
      id: history_door
    timeout: 30000
