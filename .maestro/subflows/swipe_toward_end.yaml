# Toward end is a rightward drag.
# See swipe_toward_start.yaml for the 40% / past-45% split.
appId: app.pane.android
---
- runFlow:
    when:
      true: ${DIST == '40'}
    commands:
      - swipe:
          from:
            id: history_row_0
          direction: RIGHT
          duration: 2000
- runFlow:
    when:
      true: ${DIST == '55'}
    commands:
      - swipe:
          from:
            id: history_row_0
            point: "5%, 50%"
          direction: RIGHT
          duration: 1500
