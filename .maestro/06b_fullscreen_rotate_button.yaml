appId: app.pane.android
name: Manual rotate button works with auto-rotate off
tags:
  - viewer
  - device
  - rotate-button-off
---
# run-maestro.sh turns accelerometer_rotation off before this flow and restores it after.
- runFlow: subflows/fresh_start.yaml
- openLink: pane://sample/x-video
- extendedWaitUntil:
    visible:
      id: viewer_done
    timeout: 15000
- tapOn:
    id: viewer_media
- extendedWaitUntil:
    visible: "Enter fullscreen"
    timeout: 10000
- tapOn: "Enter fullscreen"
- extendedWaitUntil:
    visible: "Exit fullscreen"
    timeout: 10000
- tapOn: "Rotate to landscape"
- takeScreenshot: fs_rotated_by_button
- assertVisible: "Exit fullscreen"
- tapOn: "Rotate to portrait"
- takeScreenshot: fs_rotated_back
- tapOn: "Exit fullscreen"
- assertVisible:
    id: viewer_done
