appId: app.pane.android
name: Undo restores; Undo dies with the screen
tags:
  - history
---
- runFlow: subflows/fresh_start.yaml
- runFlow: subflows/seed_history.yaml
- runFlow: subflows/open_history.yaml
- copyTextFrom:
    id: history_row_0_title
# The title node is the full sentence wrapped in bidi isolates, painted
# ellipsized. Maestro matches the whole node text, so allow junk on either
# side of a short visible prefix. The same pattern is assertNotVisible later.
- evalScript: ${output.prefix = '.*' + maestro.copiedText.replace(/[^\x20-\x7E]/g, '').substring(0, 22) + '.*'}
- runFlow:
    file: subflows/swipe_toward_start.yaml
    env:
      DIST: "55"
- tapOn: ${TEXT_UNDO}
- extendedWaitUntil:
    visible: ${output.prefix}
    timeout: 10000
- runFlow:
    file: subflows/swipe_toward_start.yaml
    env:
      DIST: "55"
- assertVisible: ${TEXT_UNDO}
- back
- runFlow: subflows/open_history.yaml
- assertNotVisible: ${TEXT_UNDO}
- assertNotVisible: ${output.prefix}
