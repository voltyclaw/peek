appId: app.pane.android
name: Fullscreen follows physical rotation with auto-rotate on
tags:
  - viewer
  - device
---
# run-maestro.sh sets accelerometer_rotation 1 before this pass.
# Inline controls start hidden; a tap on the fixture video reveals fullscreen.
# Maestro 2.11 accepts PORTRAIT, LANDSCAPE_LEFT, LANDSCAPE_RIGHT, and UPSIDE_DOWN.
# There is no documented way to read the current orientation, so this flow checks
# that Exit fullscreen survives both turns. run-maestro.sh logs mCurrentRotation.
- runFlow: subflows/fresh_start.yaml
- openLink: pane://sample/x-video
- extendedWaitUntil:
    visible:
      id: viewer_done
    timeout: 15000
- tapOn:
    id: viewer_media
- extendedWaitUntil:
    visible: "Enter fullscreen"
    timeout: 10000
- tapOn: "Enter fullscreen"
- extendedWaitUntil:
    visible: "Exit fullscreen"
    timeout: 10000
- setOrientation: LANDSCAPE_LEFT
- runFlow:
    when:
      notVisible: "Exit fullscreen"
    commands:
      - tapOn:
          id: viewer_player_surface
- assertVisible: "Exit fullscreen"
- setOrientation: PORTRAIT
- runFlow:
    when:
      notVisible: "Exit fullscreen"
    commands:
      - tapOn:
          id: viewer_player_surface
- assertVisible: "Exit fullscreen"
- tapOn: "Exit fullscreen"
- assertVisible:
    id: viewer_done
