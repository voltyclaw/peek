appId: app.pane.android
name: Fullscreen follows physical rotation with auto-rotate on
tags:
  - viewer
  - device
---
# run-maestro.sh sets accelerometer_rotation 1 before this pass.
# Inline controls start hidden; a tap on the fixture video reveals fullscreen.
# Maestro 2.11 accepts PORTRAIT, LANDSCAPE_LEFT, LANDSCAPE_RIGHT, and UPSIDE_DOWN.
# There is no documented way to read the current orientation, so this flow checks
# that Exit fullscreen survives both turns. run-maestro.sh logs mCurrentRotation.
- runFlow: subflows/fresh_start.yaml
- openLink: pane://sample/x-video
- extendedWaitUntil:
    visible:
      id: viewer_done
    timeout: 30000
# First tap shows controls. The second hits pause, so they stay up.
# Auto-hide is 3s while the video is playing, shorter than a slow hierarchy poll.
- tapOn:
    id: viewer_media
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: viewer_media
- extendedWaitUntil:
    visible:
      id: viewer_fullscreen
    timeout: 10000
- tapOn:
    id: viewer_fullscreen
# Chrome starts visible, then hides after 3s while the video plays.
# If it is already gone, a tap on the player shows it again.
- extendedWaitUntil:
    visible:
      id: viewer_player_surface
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: viewer_exit_fullscreen
    commands:
      - tapOn:
          id: viewer_player_surface
- extendedWaitUntil:
    visible:
      id: viewer_exit_fullscreen
    timeout: 10000
- setOrientation: LANDSCAPE_LEFT
- runFlow:
    when:
      notVisible:
        id: viewer_exit_fullscreen
    commands:
      - tapOn:
          id: viewer_player_surface
- assertVisible:
    id: viewer_exit_fullscreen
- setOrientation: PORTRAIT
- runFlow:
    when:
      notVisible:
        id: viewer_exit_fullscreen
    commands:
      - tapOn:
          id: viewer_player_surface
- assertVisible:
    id: viewer_exit_fullscreen
- tapOn:
    id: viewer_exit_fullscreen
- assertVisible:
    id: viewer_done
