appId: app.pane.android
name: Fullscreen follows physical rotation with auto-rotate on
tags:
  - viewer
  - device
---
# run-maestro.sh sets accelerometer_rotation 1 before this pass.
# Inline controls start hidden; a tap on the fixture video reveals fullscreen.
# Maestro 2.11 accepts PORTRAIT, LANDSCAPE_LEFT, LANDSCAPE_RIGHT, and UPSIDE_DOWN.
# There is no documented way to read the current orientation, so this flow checks
# that Exit fullscreen survives both turns. run-maestro.sh logs mCurrentRotation.
- runFlow: subflows/fresh_start.yaml
- openLink: pane://sample/x-video
- runFlow: subflows/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: viewer_done
    timeout: 30000
# Controls start hidden and hide again after 3s while the video plays.
# Each tap toggles them, so only tap while the pause button is absent,
# then pause from that button so they stay up for the fullscreen control.
- repeat:
    times: 4
    while:
      notVisible:
        id: viewer_pause
    commands:
      - tapOn:
          id: viewer_media
      # Controls stay up 3s. Check while they are still on screen.
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible:
      id: viewer_pause
    timeout: 5000
- tapOn:
    id: viewer_pause
- extendedWaitUntil:
    visible:
      id: viewer_fullscreen
    timeout: 10000
- tapOn:
    id: viewer_fullscreen
# Chrome starts visible, then hides after 3s while the video plays.
# If it is already gone, a tap on the player shows it again.
- extendedWaitUntil:
    visible:
      id: viewer_player_surface
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: viewer_exit_fullscreen
    commands:
      - tapOn:
          id: viewer_player_surface
- extendedWaitUntil:
    visible:
      id: viewer_exit_fullscreen
    timeout: 10000
- setOrientation: LANDSCAPE_LEFT
- runFlow:
    when:
      notVisible:
        id: viewer_exit_fullscreen
    commands:
      - tapOn:
          id: viewer_player_surface
- assertVisible:
    id: viewer_exit_fullscreen
- setOrientation: PORTRAIT
- runFlow:
    when:
      notVisible:
        id: viewer_exit_fullscreen
    commands:
      - tapOn:
          id: viewer_player_surface
- assertVisible:
    id: viewer_exit_fullscreen
- tapOn:
    id: viewer_exit_fullscreen
- assertVisible:
    id: viewer_done
